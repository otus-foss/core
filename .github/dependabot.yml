# Opens one grouped pull request a week per ecosystem. Titles follow the commit rules, such as
# "build(deps): bump the gradle group". Mark a pull request ready to run CI, as with any other.
version: 2
updates:
  - package-ecosystem: github-actions
    # The root covers .github/workflows; the composite actions each need their own entry.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
