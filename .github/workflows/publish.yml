name: publish

# Manual runs validate the complete release locally without uploading packages.
# Paused: version tags no longer publish. To resume, trigger on pushed tags matching "v*" again.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # Kotlin builds Android artifacts and both iOS library variants on Linux.
    # App linking and simulator tests remain in the separate macOS quality job. This job has no
    # package permission, so tests and build scripts never run with a token that can publish.
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that the tag matches the version
        if: github.event_name == 'push'
        run: test "v$(sed -n 's/^version=//p' gradle.properties)" = "$GITHUB_REF_NAME"
      - name: Check that the tag is on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Run every module's common and Android host tests
        run: ./gradlew testAndroidHostTest --console=plain
      # Build every publication first so a failing module cannot leave a release half uploaded.
      - name: Build every publication in an isolated local repository
        run: ./gradlew publishToMavenLocal -Dmaven.repo.local="$PWD/build/publications-local" --console=plain
      - name: Verify all root, Android, and iOS artifacts
        run: python3 tools/check_publications.py build/publications-local "$(sed -n 's/^version=//p' gradle.properties)"

  publish:
    # Only a version tag uploads, after the build job has tested and verified the same commit.
    # Gradle builds the publications again here; see docs/releasing.md.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Publish the tagged release to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --console=plain
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
