name: publish

# Manual runs validate the complete release locally without uploading packages.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Kotlin builds Android artifacts and both iOS library variants on Linux.
    # App linking and simulator tests remain in the separate macOS quality job.
    runs-on: ubicloud-standard-2
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check that the tag matches the version
        if: github.event_name == 'push'
        run: test "v$(sed -n 's/^version=//p' gradle.properties)" = "$GITHUB_REF_NAME"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: python3 -m pip install -r requirements-quality.txt
      - run: ./gradlew checkAll --console=plain
      # Build every publication first so a failing module cannot leave a release half uploaded.
      - name: Build every publication in an isolated local repository
        run: ./gradlew publishToMavenLocal -Dmaven.repo.local="$PWD/build/publications-local" --console=plain
      - name: Verify all root, Android, and iOS artifacts
        run: python3 tools/check_publications.py build/publications-local "$(sed -n 's/^version=//p' gradle.properties)"
      - name: Publish the tagged release to GitHub Packages
        if: github.event_name == 'push'
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --console=plain
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
