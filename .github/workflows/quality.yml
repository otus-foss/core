name: quality

# Runs once a pull request is ready: when it opens as ready, or when a draft is marked ready. Later
# pushes start it again only while the pull request has the "ci on every push" label, and adding that
# label starts it at once. Draft pull requests never run it. Every push to main, which includes each
# merged pull request, runs it again so main itself stays checked.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

# Each kind of event gets its own group. Most events start a run that skips every job, such as an
# unlabeled push, and that run must not cancel a real one started by another kind of event. Runs on
# main never cancel each other, so every merge gets its own result.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Decides which jobs this change needs. Workflow-only and Markdown-only changes skip the build,
  # except a change to this workflow, and changes that touch only Android code skip the macOS job.
  # A push to main compares it with the commit before. A run started by hand runs everything.
  changes:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      !github.event.pull_request.draft && (
        github.event.action == 'opened' || github.event.action == 'ready_for_review' ||
        github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci on every push') ||
        github.event.action == 'labeled' && github.event.label.name == 'ci on every push')
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.files.outputs.build }}
      ios: ${{ steps.files.outputs.ios }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -n "$PR" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > files.txt
          elif [ -n "${BEFORE//0/}" ]; then
            gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename' > files.txt
          fi
          # A run by hand, a new branch, or a compare cut off at 300 files checks everything.
          if [ ! -s files.txt ] || [ "$(wc -l < files.txt)" -ge 300 ]; then
            printf 'build=true\nios=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          touched() { if grep -qvE "$1" files.txt || grep -qx '.github/workflows/quality.yml' files.txt; then echo true; else echo false; fi; }
          echo "build=$(touched '^\.github/|\.md$')" >> "$GITHUB_OUTPUT"
          echo "ios=$(touched '^\.github/|\.md$|^docs/|(^|/)src/(androidMain|androidHostTest|androidUnitTest|androidTest)/')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Each job runs one part of checkAll, so the parts run at the same time. Every part except
  # quality skips qualityCheck, which each module's check task would otherwise run again.
  check:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: check (${{ matrix.part }})
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: quality
            tasks: qualityCheck
          - part: design system
            tasks: checkDesignSystem -x qualityCheck
          - part: libraries
            tasks: checkLibraries -x qualityCheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: python3 -m pip install -r requirements-quality.txt
      - run: ./gradlew ${{ matrix.tasks }} --console=plain

  # Runs only while the repository variable IOS_CI is "on" (Settings > Secrets and variables >
  # Actions > Variables), so macOS minutes stay off until someone turns it back on.
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true' && vars.IOS_CI == 'on'
    # Ubicloud has no macOS runners, so this job runs on GitHub's.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Compose Multiplatform links iOS 26 SDK symbols, so iOS tests need Xcode 26.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew iosSimulatorArm64Test --console=plain
      # Gradle's log names a failing test but not its assertion; the report has it.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-reports
          path: "*/build/reports/tests/iosSimulatorArm64Test/"
