name: quality

# Runs once a pull request is ready: when it opens as ready, or when a draft is marked ready. Later
# pushes start it again only while the pull request has the "ci on every push" label, and adding that
# label starts it at once. Draft pull requests never run it. Every push to main, which includes each
# merged pull request, runs it again so main itself stays checked.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

# Each kind of event gets its own group. Most events start a run that skips every job, such as an
# unlabeled push, and that run must not cancel a real one started by another kind of event. Runs on
# main never cancel each other, so every merge gets its own result.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Decides which jobs this change needs; see .github/actions/quality-changes.
  # A run the ready gate stops sets no outputs, so every later job skips.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.files.outputs.build }}
      ios: ${{ steps.files.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ready-gate
      - id: files
        if: steps.gate.outputs.ready == 'true'
        uses: ./.github/actions/quality-changes

  # Each job runs one part of checkAll, so the parts run at the same time. Every part except
  # quality skips qualityCheck, which each module's check task would otherwise run again.
  check:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: check (${{ matrix.part }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: quality
            tasks: qualityCheck
          - part: design system
            tasks: checkDesignSystem -x qualityCheck
          - part: libraries
            tasks: checkLibraries -x qualityCheck
          # Not part of checkAll: compiles every module's iosMain on Linux, so iOS code breaks show
          # even while the macOS job is off.
          - part: ios metadata
            tasks: compileIosMainKotlinMetadata -x qualityCheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
      - run: ./gradlew ${{ matrix.tasks }} --console=plain

  # Compiles each app against this Core, at the app branch with this branch's name when there is one,
  # else its main, so a Core change that breaks an app shows here before it lands. The apps are
  # public, so the checkout needs no key.
  apps:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: apps (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: otus-mail
            tasks: :shared:compileAndroidMain :androidApp:compileDebugKotlin
          - app: otus-calendar
            tasks: :androidApp:compileDebugKotlin
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: otus-core
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.app }}
          path: ${{ matrix.app }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use the app partner branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - uses: ./otus-core/.github/actions/setup-build
        with:
          directory: ${{ matrix.app }}
          python: "false"
      - run: ./gradlew ${{ matrix.tasks }} -Potus.core.path=../otus-core --console=plain

  # Runs only while the repository variable IOS_CI is "on" (Settings > Secrets and variables >
  # Actions > Variables), so macOS minutes stay off until someone turns it back on.
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true' && vars.IOS_CI == 'on'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Compose Multiplatform links iOS 26 SDK symbols, so iOS tests need Xcode 26.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - uses: ./.github/actions/setup-build
        with:
          android: "false"
          python: "false"
      - run: ./gradlew iosSimulatorArm64Test --console=plain
      # Gradle's log names a failing test but not its assertion; the report has it.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-reports
          path: "*/build/reports/tests/iosSimulatorArm64Test/"
