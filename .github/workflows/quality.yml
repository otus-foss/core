name: quality

# Runs once per pull request, when it is ready to merge: on opening a pull request that is not a
# draft, or on marking a draft ready for review. Later pushes do not start it again, so open a
# draft and mark it ready once every commit is pushed. Start it by hand to check again.
on:
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

# A draft and a ready run go in separate groups. Opening a pull request and marking it ready at
# once starts both, and the skipped draft run would otherwise cancel the ready one.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  # Each job runs one part of checkAll, so the parts run at the same time. Every part except
  # quality skips qualityCheck, which each module's check task would otherwise run again.
  check:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    name: check (${{ matrix.part }})
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: quality
            tasks: qualityCheck
          - part: design system
            tasks: checkDesignSystem -x qualityCheck
          - part: libraries
            tasks: checkLibraries -x qualityCheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: python3 -m pip install -r requirements-quality.txt
      - run: ./gradlew ${{ matrix.tasks }} --console=plain

  ios:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    # Ubicloud has no macOS runners, so this job runs on GitHub's.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Compose Multiplatform links iOS 26 SDK symbols, so iOS tests need Xcode 26.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: ./gradlew iosSimulatorArm64Test --console=plain
      # Gradle's log names a failing test but not its assertion; the report has it.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-reports
          path: "*/build/reports/tests/iosSimulatorArm64Test/"
