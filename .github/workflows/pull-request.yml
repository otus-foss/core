name: pull request

# Advisory facts about a pull request: a size label, a comment with the screenshots it adds or
# changes, and a warning when UI code changes without new screenshots. Nothing here fails a pull
# request. Runs when quality does.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]

permissions:
  contents: read

# Each kind of event gets its own group, so a run that skips everything cannot cancel a real one.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  # Decides whether this run checks anything; see .github/actions/ready-gate.
  gate:
    runs-on: ubicloud-standard-2
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ready-gate

  # The size label and the screenshot comment; see .github/actions/size-label and
  # screenshot-comment.
  facts:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/size-label
      - uses: ./.github/actions/screenshot-comment
