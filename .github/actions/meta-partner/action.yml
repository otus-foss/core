name: Use the Meta partner branch
description: >-
  An app builds against the otus-meta branch with its own branch's name when there is one, else
  against Meta's main. Run it after checking out otus-meta with full history.
inputs:
  branch:
    description: The app branch, such as github.head_ref || github.ref_name
    required: true
  path:
    description: The otus-meta checkout, relative to the workspace
    default: otus-meta
outputs:
  partner:
    description: "true when otus-meta has a branch with this name"
    value: ${{ steps.switch.outputs.partner }}
runs:
  using: composite
  steps:
    - id: switch
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        BRANCH: ${{ inputs.branch }}
      run: |
        if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
          git checkout --quiet --detach "origin/$BRANCH"
          echo "partner=true" >> "$GITHUB_OUTPUT"
        else
          echo "partner=false" >> "$GITHUB_OUTPUT"
        fi
        git log --oneline -1
