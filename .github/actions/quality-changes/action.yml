name: Quality changes
description: >-
  Which quality jobs a change needs. Workflow-only and Markdown-only changes skip the build, except
  a change to the quality workflow itself, and changes that touch only Android code or docs skip
  the macOS job. A pull request lists its files; a push to main compares it with the commit before.
  A run by hand, a new branch, or a compare cut off at 300 files checks everything. Needs
  pull-requests read permission.
outputs:
  build:
    description: "true when the Gradle checks should run"
    value: ${{ steps.files.outputs.build }}
  ios:
    description: "true when the macOS job should run"
    value: ${{ steps.files.outputs.ios }}
runs:
  using: composite
  steps:
    - id: files
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.sha }}
      run: |
        if [ -n "$PR" ]; then
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > files.txt
        elif [ -n "${BEFORE//0/}" ]; then
          gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename' > files.txt
        fi
        if [ ! -s files.txt ] || [ "$(wc -l < files.txt)" -ge 300 ]; then
          printf 'build=true\nios=true\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        touched() { if grep -qvE "$1" files.txt || grep -qE '^\.github/(workflows/quality\.yml|actions/)' files.txt; then echo true; else echo false; fi; }
        echo "build=$(touched '^\.github/|\.md$')" >> "$GITHUB_OUTPUT"
        echo "ios=$(touched '^\.github/|\.md$|^docs/|^androidApp/|(^|/)src/(androidMain|androidHostTest|androidUnitTest|androidTest|test)/')" >> "$GITHUB_OUTPUT"
        cat "$GITHUB_OUTPUT"
