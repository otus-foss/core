name: publish

# Publish to Forgejo after its package token and macOS runner are configured.
on:
  push:
    tags: ["v*"]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # One macOS build produces the Android, iOS device, and iOS simulator variants together.
    runs-on: otus-macos
    timeout-minutes: 60
    steps:
      - name: Require the package publishing token
        env:
          PACKAGES_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
        run: test -n "$PACKAGES_TOKEN"
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Compose Multiplatform links iOS 26 SDK symbols, so iOS tests need Xcode 26.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - name: Check that the tag matches the version
        run: test "v$(sed -n 's/^version=//p' gradle.properties)" = "$FORGEJO_REF_NAME"
      - uses: https://github.com/actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: https://github.com/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: https://github.com/android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: python3 -m pip install -r requirements-quality.txt
      - run: ./gradlew checkAll iosSimulatorArm64Test --console=plain
      # Build every publication first so a failing module cannot leave a release half uploaded.
      - run: ./gradlew publishToMavenLocal --console=plain
      - run: ./gradlew publishAllPublicationsToForgejoPackagesRepository --console=plain
        env:
          ORG_GRADLE_PROJECT_ForgejoPackagesUsername: ${{ forgejo.repository_owner }}
          ORG_GRADLE_PROJECT_ForgejoPackagesPassword: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
