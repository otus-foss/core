<svg xmlns="http://www.w3.org/2000/svg" id="om" viewBox="0 0 128 128" width="512" height="512"><style>
svg .rise,svg .tilt,svg .obj{transform-box:view-box}
svg .eye{transform-box:fill-box;transform-origin:center}
#og .tilt{transform-origin:64px 128px} #om .tilt,#oc .tilt{transform-origin:64px 92px}
svg .rise{animation:rise 3s cubic-bezier(.2,.8,.25,1) both}
#om .rise,#oc .rise{animation-name:riseB}
svg .tilt{animation:tilt 3s ease-in-out both}
svg .eye{animation:blink 3s linear both}
svg .obj{animation:obj 3s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{0%,5%{transform:translateY(130px)}22%{transform:translateY(-3px)}27%,100%{transform:translateY(0)}}
@keyframes riseB{0%,10%{transform:translateY(110px)}30%{transform:translateY(-3px)}36%,100%{transform:translateY(0)}}
@keyframes obj{0%{transform:translateY(70px)}13%{transform:translateY(-2px)}18%,100%{transform:translateY(0)}}
@keyframes tilt{0%,36%{transform:rotate(12deg)}50%{transform:rotate(-3deg)}57%,100%{transform:rotate(0deg)}}
@keyframes blink{0%,70%{transform:scaleY(1)}72%{transform:scaleY(.08)}74%,82%{transform:scaleY(1)}84%{transform:scaleY(.08)}86%,100%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){svg *{animation:none!important}}
