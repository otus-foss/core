# The one catalog for every Otus repository. Mail and Calendar load this file as `libs`, so each
# version here is the suite's version; an app keeps only what no other repository uses in its own
# gradle/app.versions.toml.
[versions]
agp = "9.1.1"
kotlin = "2.4.10"
compose-multiplatform = "1.11.1"
android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "24"
androidx-activity = "1.13.0"

robolectric = "4.17"
roborazzi = "1.76.0"
androidx-compose-test = "1.11.2"

navigation-event = "1.0.1"
kotlinx-datetime = "0.7.1"
ktor = "3.6.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
kotlinx-io = "0.9.1"
richeditor = "1.1.0"
kover = "0.9.9"

# Quality tools, run by build-logic's otus.quality plugin.
spotless = "8.10.3"
ktlint = "1.8.0"
detekt = "1.23.8"

[libraries]
richeditor = { module = "com.mohamedrejeb.richeditor:richeditor-compose", version.ref = "richeditor" }
kotlinx-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }

compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }

robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
androidx-compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-test" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-test" }

navigation-event-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigation-event" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }

# Meta's modules as the apps see them. The apps build Meta from source, so Gradle substitutes each
# with the matching project of the included otus-meta build; Meta itself uses project accessors.
otus-json-types = { module = "com.otus:json-types" }
otus-storage = { module = "com.otus:storage" }
otus-jmap = { module = "com.otus:jmap" }
otus-avatar = { module = "com.otus:avatar" }
otus-avatar-ui = { module = "com.otus:avatar-ui" }
otus-dateformat = { module = "com.otus:dateformat" }
otus-designsystem = { module = "com.otus:designsystem" }
otus-settings = { module = "com.otus:settings" }
otus-accounts = { module = "com.otus:accounts" }
otus-jmap-push = { module = "com.otus:jmap-push" }
otus-jscontact = { module = "com.otus:jscontact" }
otus-jmap-contacts = { module = "com.otus:jmap-contacts" }

# Gradle plugins that build-logic's convention plugins apply.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compilerGradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

# Plugins that modules apply themselves. build-logic's convention plugins apply the rest.
[plugins]
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
